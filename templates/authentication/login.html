<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Planner | Log in</title>
  </head>
  <body>
    <main>
      <h1>Log in to Project Planner</h1>
      <form id="login-form">
        <p>
          <label for="username">Username</label><br>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </p>
        <p>
          <label for="password">Password</label><br>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </p>
        <button type="submit">Log in</button>
      </form>
      <p id="login-message" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const message = document.getElementById('login-message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = 'Signing in...';

        try {
          const response = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: form.elements.username.value,
              password: form.elements.password.value,
            }),
          });
          const data = await response.json();

          if (!response.ok) {
            message.textContent = data.msg || 'Unable to log in. Check your username and password.';
            return;
          }

          sessionStorage.setItem('access', data.access);
          sessionStorage.setItem('refresh', data.refresh);
          message.textContent = 'Login successful.';
        } catch {
          message.textContent = 'Unable to reach the server. Please try again.';
        }
      });
    </script>
  </body>
</html>
